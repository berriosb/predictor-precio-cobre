name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `defaults.run.working-directory` es web/, asi que las rutas van relativas ahi.
      - name: Verify export is reproducible
        run: git diff --exit-code src/data/dashboard.json public/cobre-hgf.csv

  python:
    name: Pipeline Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Solo lo que necesitan src/data_loader.py y src/features.py, que es lo
      # que cubren los tests. No se instala el freeze completo de
      # requirements.txt (73 paquetes) porque el pipeline no se entrena en CI:
      # eso se verifica localmente contra los artefactos versionados.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pandas numpy scipy pyyaml

      - name: Lint
        run: ruff check . --output-format=concise

      - name: Tests
        run: pytest tests/ -q

      # Guard que habria detectado el hueco de statsmodels que rompia
      # retrain.py: verifica por AST que ningun import de terceros sin
      # try/except quede fuera de requirements.txt.
      - name: Check third-party imports against requirements.txt
        run: python .github/scripts/check_python_deps.py

      # No debe haber secrets ni claves versionados.
      - name: Security scan
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -vE '\.env\.(example|sample|template|test|ci|defaults)$'; then
            echo "::error::archivo .env trackeado"; exit 1
          fi
          if git ls-files | grep -E '\.(pem|key|pkcs12|pfx|id_rsa|id_ed25519)$'; then
            echo "::error::clave privada trackeada"; exit 1
          fi
          echo "sin secretos trackeados"